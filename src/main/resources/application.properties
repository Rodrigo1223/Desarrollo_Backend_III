# Base de datos real por defecto: MySQL local.
# Para pruebas aisladas, se puede sobrescribir con H2 mediante variables de entorno.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/bancoxyz_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.driverClassName=${DB_DRIVER:com.mysql.cj.jdbc.Driver}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=1234

spring.h2.console.enabled=${H2_CONSOLE_ENABLED:false}
spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.batch.jdbc.initialize-schema=always
spring.batch.schema=${BATCH_SCHEMA:classpath:org/springframework/batch/core/schema-mysql.sql}
spring.batch.job.enabled=false
spring.batch.job.name=cuentaAnualJob
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.open-in-view=false